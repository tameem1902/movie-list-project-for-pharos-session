<!DOCTYPE html> <!-- يحدد نوع الملف أنه مستند HTML5 أحدث إصدار -->
<html lang="ar" dir="rtl"> <!-- بداية صفحة الـ HTML وتحديد اللغة العربية واتجاه النص من اليمين لليسار -->
<head> <!-- رأس الصفحة: يحتوي على الإعدادات والعناوين والروابط الخارجية -->
    <meta charset="UTF-8"> <!-- يضمن دعم جميع الحروف واللغة العربية بشكل صحيح دون مشاكل -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- تجعل الصفحة متناسبة ومستجيبة مع كافة الشاشات والموبايل -->
    <title>Favorite Movies List</title> <!-- عنوان الصفحة الذي يظهر في أعلى المتصفح -->
    <link rel="stylesheet" href="style.css"> <!-- ربط ملف التنسيقات والشكل CSS بالصفحة -->
</head>
<body> <!-- جسم الصفحة: يحتوي على العناصر المرئية التي ستظهر للمستخدم -->

    <!-- كارت رئيسي يجمع كل مكونات الموقع في المنتصف بشكل منظم ومبسط -->
    <div class="card">
        
        <!-- عنوان الواجهة الرئيسي -->
        <h1>🎬 Favorite Movies</h1> 

        <!-- النص التوضيحي لخانة الإدخال -->
        <label for="movieInput">Add your favorite movie:</label> <!-- نص توضيحي يحدد الغرض من خانة الإدخال -->
        
        <!-- خانة كتابة اسم الفيلم المفضل -->
        <input type="text" id="movieInput" placeholder="اكتب اسم الفيلم هنا..."> <!-- حقل إدخال النص يكتب فيه المستخدم اسم الفيلم -->

        <!-- زر الإضافة -->
        <button id="addBtn">Add</button> <!-- زر عند الضغط عليه ينفذ كود البرمجة لإضافة الفيلم -->

        <!-- رسالة نجاح الإضافة (تكون مخفية في البداية وتظهر عند الإضافة) -->
        <p id="successMsg" class="hidden">✓ Successfully added!</p>

        <!-- قسم عرض قائمة الأفلام المفضلة -->
        <h2>Favorite Movies List:</h2> <!-- عنوان فرعي لقائمة الأفلام -->
        <ul id="moviesList"></ul> <!-- قائمة غير مرتبة تظهر فيها أسماء الأفلام المفضلة بعد الإضافة -->

    </div>

    <!-- ربط ملف البرمجة والتفاعل JavaScript بالصفحة -->
    <script src="script.js"></script> <!-- يتم وضعه في نهاية الـ body لضمان تحميل كافة عناصر الصفحة أولاً قبل تشغيل البرمجة -->
</body>
</html>
