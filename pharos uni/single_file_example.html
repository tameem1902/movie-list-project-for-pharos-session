<!DOCTYPE html> <!-- يحدد نوع الملف أنه مستند HTML5 أحدث إصدار -->
<html lang="ar" dir="rtl"> <!-- بداية صفحة الـ HTML وتحديد اللغة العربية واتجاه النص من اليمين لليسار -->

<head> <!-- رأس الصفحة: يحتوي على الإعدادات والعناوين والتنسيقات -->
    <meta charset="UTF-8"> <!-- يضمن دعم اللغة العربية تماماً دون مشاكل في الحروف -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- تجعل الصفحة متناسبة مع كافة الشاشات والموبايل -->
    <title>Favorite Movies List</title> <!-- عنوان الصفحة الذي يظهر في أعلى المتصفح -->

    <!-- كود الـ CSS المدمج داخل رأس الصفحة لتنسيق العناصر -->
    <style>
        /* إعادة ضبط التنسيقات الأساسية وإزالة الهوامش الافتراضية */
        * {
            box-sizing: border-box;
            /* يجعل حساب الأحجام يضم الحواف والمسافات الداخلية */
            margin: 0;
            /* إزالة الهوامش الخارجية الافتراضية */
            padding: 0;
            /* إزالة المسافات الداخلية الافتراضية */
            font-family: system-ui, -apple-system, sans-serif;
            /* نوع الخط المستخدم */
        }

        /* تنسيق خلفية ورأس الصفحة بالكامل */
        body {
            background-color: #f4f6f9;
            /* لون خلفية رمادي فاتح مريح للعين */
            display: flex;
            /* نظام فليكس بوكس لتوسط العناصر */
            justify-content: center;
            /* وضع العناصر في المنتصف أفقيًا */
            align-items: center;
            /* وضع العناصر في المنتصف رأسيًا */
            min-height: 100vh;
            /* جعل جسم الصفحة يأخذ كامل ارتفاع الشاشة */
            padding: 20px;
            /* مسافة حماية للحواف */
        }

        /* تنسيق الكارت (الحاوية الرئيسية) */
        .card {
            background: #ffffff;
            /* لون خلفية أبيض */
            padding: 30px;
            /* مسافة داخلية */
            border-radius: 12px;
            /* حواف دائرية ناعمة */
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            /* ظل خفيف خلف الكارت */
            width: 100%;
            /* تمدد حسب الشاشة */
            max-width: 400px;
            /* أقصى عرض 400 بكسل */
        }

        /* تنسيق العنوان الرئيسي */
        h1 {
            font-size: 24px;
            /* حجم الخط */
            color: #2c3e50;
            /* لون أزرق داكن */
            margin-bottom: 20px;
            /* مسافة أسفل العنوان */
            text-align: center;
            /* محاذاة النص في المنتصف */
        }

        /* تنسيق النص التوضيحي للخانة */
        label {
            display: block;
            /* جعل النص في سطر منفصل مستقل */
            font-weight: bold;
            /* خط عريض */
            margin-bottom: 8px;
            /* مسافة أسفل النص */
            color: #34495e;
            /* لون داكن ناعم */
        }

        /* تنسيق حقل إدخال النص */
        input {
            width: 100%;
            /* عرض كامل */
            padding: 12px;
            /* مسافة داخلية للكتابة */
            border: 1px solid #cccccc;
            /* إطار رمادي بسيط */
            border-radius: 6px;
            /* زوايا ناعمة */
            font-size: 16px;
            /* حجم الخط */
            margin-bottom: 12px;
            /* مسافة أسفل الخانة */
            outline: none;
            /* إزالة إطار التركيز الافتراضي */
        }

        /* تنسيق الخانة عند التركيز والضغط عليها */
        input:focus {
            border-color: #3498db;
            /* تغيير لون الإطار للأزرق */
        }

        /* تنسيق زر الإضافة */
        button {
            width: 100%;
            /* عرض كامل */
            padding: 12px;
            /* مسافة داخلية */
            background-color: #2ecc71;
            /* لون أخضر جذاب */
            color: white;
            /* نص أبيض */
            border: none;
            /* إزالة الإطار */
            border-radius: 6px;
            /* زوايا ناعمة */
            font-size: 16px;
            /* حجم الخط */
            font-weight: bold;
            /* خط عريض */
            cursor: pointer;
            /* مؤشر الماوس يتحول ليد */
        }

        /* تأثير التحويم على الزر بالماوس */
        button:hover {
            background-color: #27ae60;
            /* أخضر أغمق عند مرور الماوس */
        }

        /* تنسيق رسالة التأكيد والنجاح */
        #successMsg {
            color: #27ae60;
            /* لون أخضر للنجاح */
            background-color: #e8f8f5;
            /* خلفية خضراء فاتحة جداً */
            padding: 10px;
            /* مسافة داخلية */
            border-radius: 6px;
            /* حواف ناعمة */
            text-align: center;
            /* محاذاة في المنتصف */
            margin-top: 12px;
            /* مسافة فوق الرسالة */
            font-weight: bold;
            /* خط عريض */
        }

        /* كلاس لإخفاء العناصر من الشاشة */
        .hidden {
            display: none;
            /* يخفي العنصر تماماً */
        }

        /* تنسيق عنوان القائمة */
        h2 {
            font-size: 18px;
            /* حجم الخط */
            margin-top: 20px;
            /* مسافة أعلى العنوان */
            margin-bottom: 10px;
            /* مسافة أسفل العنوان */
            color: #2c3e50;
            /* لون أزرق داكن */
        }

        /* تنسيق قائمة الأفلام */
        ul {
            list-style: none;
            /* إزالة النقاط الدائرية الافتراضية */
        }

        /* تنسيق كل عنصر فيلم مضاف في القائمة */
        ul li {
            background: #f8f9fa;
            /* خلفية رمادية فاتحة */
            padding: 10px 15px;
            /* مسافة داخلية */
            border-left: 4px solid #3498db;
            /* شريط أزرق أنيق جانبي */
            border-radius: 4px;
            /* زوايا ناعمة */
            margin-bottom: 8px;
            /* مسافة بين العناصر */
            font-size: 15px;
            /* حجم الخط */
            color: #333333;
            /* لون النص */
        }
    </style>
</head>

<body> <!-- جسم الصفحة: يحتوي على العناصر المرئية -->

    <!-- كارت رئيسي يجمع كل المكونات -->
    <div class="card">

        <!-- عنوان الصفحة -->
        <h1>🎬 Favorite Movies</h1>

        <!-- النص التوضيحي للخانة -->
        <label for="movieInput">Add your favorite movie:</label>

        <!-- خانة الإدخال -->
        <input type="text" id="movieInput" placeholder="اكتب اسم الفيلم هنا...">

        <!-- زر الإضافة -->
        <button id="addBtn">Add</button>

        <!-- رسالة النجاح (مخفية افتراضياً) -->
        <p id="successMsg" class="hidden">✓ Successfully added!</p>

        <!-- عنوان القائمة والمساحة المخزنة -->
        <h2>Favorite Movies List:</h2>
        <ul id="moviesList"></ul> <!-- القائمة التي يظهر بها الفيلم المضاف -->

    </div>

    <!-- كود البرمجة والتفاعل JavaScript -->
    <script>
        // 1. الوصول للعناصر من الـ HTML باستخدام ID
        const movieInput = document.getElementById('movieInput'); // خانة الإدخال
        const addBtn = document.getElementById('addBtn'); // زر الإضافة
        const moviesList = document.getElementById('moviesList'); // القائمة ul
        const successMsg = document.getElementById('successMsg'); // رسالة النجاح

        // 2. الاستماع لحدث الضغط على زر الإضافة
        addBtn.addEventListener('click', function () {

            // أخذ قيمة النص المكتوب وحذف المسافات الزائدة
            const movieTitle = movieInput.value.trim();

            // التأكد أن الخانة ليست فارغة
            if (movieTitle === "") {
                alert("من فضلك اكتب اسم الفيلم أولاً!"); // تنبيه إذا كان الحقل فارغاً
                return; // إيقاف التنفيذ
            }

            // 3. إنشاء عنصر جديد <li> للفيلم
            const newListItem = document.createElement('li'); // إنشاء li جديد
            newListItem.textContent = movieTitle; // إضافة نص اسم الفيلم داخله

            // 4. وضع العنصر الجديد داخل القائمة ul
            moviesList.appendChild(newListItem);

            // 5. إظهار رسالة "Successfully added!"
            successMsg.classList.remove('hidden');

            // 6. مسح النص المكتوب من الخانة
            movieInput.value = "";

            // 7. إخفاء رسالة النجاح بعد ثانيتين
            setTimeout(function () {
                successMsg.classList.add('hidden'); // إخفاء الرسالة مجدداً
            }, 2000);

        });
    </script>
</body>

</html>
